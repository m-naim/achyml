<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>achyml — Redirecting...</title>
    <script>
      // Detect user browser language and redirect
      var userLang = navigator.language || navigator.userLanguage;
      if (userLang && userLang.toLowerCase().startsWith('fr')) {
        window.location.replace('/fr/');
      } else {
        window.location.replace('/en/'); // Default to English
      }
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 100px; color: #64748b; font-size: 14px;">
      Redirecting to your language... <br><br>
      Si vous n'êtes pas redirigé : <a href="/fr/" style="color: #3b82f6;">Version Française</a> | <a href="/en/" style="color: #3b82f6;">English Version</a>
    </p>
  </body>
</html>
